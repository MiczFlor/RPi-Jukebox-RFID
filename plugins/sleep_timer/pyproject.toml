[project]
name = "jukebox-plugin-sleep-timer"
version = "0.1.0"
description = "Sleep timer for the Jukebox player -- stop playback automatically after N minutes"
requires-python = ">=3.9"
dependencies = []

[project.entry-points."jukebox.plugins"]
sleep_timer = "sleep_timer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sleep_timer"]
