name: Python + Docs Checks and Tests

on:
  push:
    branches:
        - 'future3/**'
    paths:
        - '.github/workflows/pythonpackage_future3.yml'
        - '.flake8'
        - 'run_flake8.sh'
        - '.coveragerc'
        - 'run_pytest.sh'
        - '**requirements*.txt'
        - '**.py'
  pull_request:
    branches:
        - 'future3/**'
    paths:
        - '.github/workflows/pythonpackage_future3.yml'
        - '.flake8'
        - 'run_flake8.sh'
        - '.coveragerc'
        - 'run_pytest.sh'
        - '**requirements*.txt'
        - '**.py'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.11', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libczmq-dev pulseaudio

        LG_COMMIT=b959a17d723360e85648316757b02dbea9902feb
        LG_ARCHIVE_SHA256=3554cd7e60d338b659d38579e6226c46690237d2abe69e8bd77ee7e3b6e615fe
        mkdir -p tmp
        wget --quiet --timeout=30 --tries=3 \
          "https://github.com/joan2937/lg/archive/${LG_COMMIT}.zip" -O tmp/lg.zip
        echo "${LG_ARCHIVE_SHA256}  tmp/lg.zip" | sha256sum --check --status
        unzip -q tmp/lg.zip -d tmp
        make -C "tmp/lg-${LG_COMMIT}"
        sudo make -C "tmp/lg-${LG_COMMIT}" install
        sudo rm -rf tmp

        python3 -m venv .venv
        source ".venv/bin/activate"

        python3 -m pip install --upgrade pip setuptools wheel
        pip3 install -r requirements-dev.txt
        # Also install all optional dependencies
        pip3 install -r src/jukebox/components/rfid/hardware/fake_reader_gui/requirements.txt
        pip3 install -r src/jukebox/components/rfid/hardware/pn532_i2c_py532/requirements.txt
        pip3 install -r src/jukebox/components/rfid/hardware/rdm6300_serial/requirements.txt
        pip3 install -r src/jukebox/components/rfid/hardware/rc522_spi/requirements.txt
    - name: Run pytest with coverage
      run: |
        ./run_pytest.sh --cov --cov-report xml --cov-config=.coveragerc
    - name: Report to Coveralls (parallel)
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.xml
        format: cobertura
        parallel: true
    - name: Lint with flake8
      run: |
        # Stop the build if linting fails
        ./run_flake8.sh

  finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
