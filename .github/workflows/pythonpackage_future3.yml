name: Python + Docs Checks and Tests

on:
  push:
    branches:
        - 'future3/**'
    paths:
        - '.github/workflows/pythonpackage_future3.yml'
        - 'pyproject.toml'
        - 'ruff.toml'
        - 'pyrightconfig.json'
        - 'run_ruff.sh'
        - 'run_pyright.sh'
        - '.coveragerc'
        - 'run_pytest.sh'
        - '**requirements*.txt'
        - '**.py'
  pull_request:
    branches:
        - 'future3/**'
    paths:
        - '.github/workflows/pythonpackage_future3.yml'
        - 'pyproject.toml'
        - 'ruff.toml'
        - 'pyrightconfig.json'
        - 'run_ruff.sh'
        - 'run_pyright.sh'
        - '.coveragerc'
        - 'run_pytest.sh'
        - '**requirements*.txt'
        - '**.py'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev pulseaudio

        CUR_DIR="$(pwd)"
        mkdir -p tmp && cd tmp && wget -q http://abyz.me.uk/lg/lg.zip && unzip lg.zip > /dev/null && cd lg && make && sudo make install
        cd "${CUR_DIR}" && sudo rm -rf tmp > /dev/null

        python3 -m venv .venv
        source ".venv/bin/activate"

        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt
        # For operation of the Jukebox, ZMQ must be compiled from sources due to Websocket support
        # Also install all optional dependencies
        pip3 install -r src/jukebox/components/rfid/hardware/fake_reader_gui/requirements.txt
        pip3 install -r src/jukebox/components/rfid/hardware/pn532_i2c_py532/requirements.txt
        pip3 install -r src/jukebox/components/rfid/hardware/rdm6300_serial/requirements.txt
        pip3 install -r src/jukebox/components/rfid/hardware/rc522_spi/requirements.txt
    - name: Run pytest with coverage
      run: |
        ./run_pytest.sh --cov --cov-report xml --cov-config=.coveragerc
    - name: Report to Coveralls (parallel)
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.xml
        format: cobertura
        parallel: true
    - name: Lint with ruff
      run: |
        # Stop the build if linting fails
        uv run ruff check --config ruff.toml .
    - name: Format check with ruff
      # Not enforced yet: the codebase has never been run through a formatter, so this would fail
      # on essentially every file. Enable once a one-time reformat commit has landed.
      continue-on-error: true
      run: |
        uv run ruff format --config ruff.toml --check --diff .
    - name: Type check with pyright
      # Not enforced yet: ~340 pre-existing errors on a codebase that has never been type-checked.
      # Report-only until that backlog is worked down.
      continue-on-error: true
      run: |
        ./run_pyright.sh

  finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
