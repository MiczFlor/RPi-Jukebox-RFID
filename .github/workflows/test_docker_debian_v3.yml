name: Test Install Scripts Debian v3

on:
  schedule:
    # run at 17:00 every sunday
    - cron: '0 17 * * 0'
  # Version 3 branches inherit this workflow, so their names are unrestricted.
  push:
    paths:
        - '.github/workflows/test_docker_debian*.yml'
        - 'installation/**'
        - 'ci/**'
        - 'resources/**'
        - 'src/jukebox/jukebox/version.py'
        - 'packages*.txt'
        - 'requirements*.txt'
  pull_request:
    # Keep PR checks scoped to version 3 target branches while v2 coexists.
    branches:
        - future3/develop
        - future3/main
    paths:
        - '.github/workflows/test_docker_debian*.yml'
        - 'installation/**'
        - 'ci/**'
        - 'resources/**'
        - 'src/jukebox/jukebox/version.py'
        - 'packages*.txt'
        - 'requirements*.txt'

# let only one instance run the test so cache is not corrupted.
# cancel already running instances as only the last run will be relevant
concurrency:
    group: ${{ github.ref }}-test-debian-v3
    cancel-in-progress: true

jobs:

  test_webapp_bundle_download:
    name: 'Web App bundle download selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Web App bundle download selection
        run: bash ./ci/installation/test_webapp_bundle_download.sh
      - name: Test library upload proxy and Samba defaults
        run: bash ./ci/installation/test_library_file_management_config.sh

  run_raspbian_armv6_zmq:
    name: 'Raspberry Pi Debian bookworm armv6 ZMQ packages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.0.0
      - name: Install distro packages and run transport smoke tests
        run: |
          docker run --rm --platform linux/arm/v6 \
            -v "$PWD/ci/installation/zmq_smoke.py:/tmp/zmq_smoke.py:ro" \
            balenalib/raspberry-pi-debian:bookworm-run@sha256:1d0a42e74be2761724ae8cb1aadb4a0684d2573e692750ea20cbb84072d66543 \
            bash -c 'apt-get update && apt-get install -y --no-install-recommends libzmq5 python3 python3-zmq && python3 /tmp/zmq_smoke.py'

  run_trixie_amd64:
    name: 'trixie amd64'
    uses: ./.github/workflows/test_docker_debian_codename_sub_v3.yml
    with:
      debian_codename: 'trixie'
      platform: linux/amd64
      test_scripts_json: >-
        ${{ github.event_name == 'schedule'
            && '["run_install_common.sh", "run_install_faststartup.sh", "run_install_webapp_download.sh"]'
            || '["run_install_common.sh", "run_install_faststartup.sh"]' }}

  run_trixie_armv7:
    name: 'trixie armv7'
    uses: ./.github/workflows/test_docker_debian_codename_sub_v3.yml
    with:
      debian_codename: 'trixie'
      platform: linux/arm/v7
      test_scripts_json: >-
        ${{ github.event_name == 'schedule'
            && '["run_install_common.sh", "run_install_faststartup.sh", "run_install_webapp_download.sh"]'
            || '["run_install_webapp_download.sh"]' }}

  run_trixie_arm64:
    name: 'trixie arm64'
    uses: ./.github/workflows/test_docker_debian_codename_sub_v3.yml
    with:
      debian_codename: 'trixie'
      platform: linux/arm64
      test_scripts_json: >-
        ${{ github.event_name == 'schedule'
            && '["run_install_common.sh", "run_install_faststartup.sh", "run_install_webapp_download.sh"]'
            || '["run_install_webapp_download.sh"]' }}
